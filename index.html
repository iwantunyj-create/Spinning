<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행운의 돌림판 - Lucky Spin Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        jua: ['Jua', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Jua', sans-serif;
        }
        .wheel-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 h-full min-h-screen flex flex-col">

    <header class="w-full bg-white/80 backdrop-blur-md border-b border-gray-100 py-4 px-6 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-pink-500 rounded-2xl flex items-center justify-center text-white shadow-md shadow-indigo-500/30">
                    <i class="fa-solid fa-dharmachakra text-xl animate-spin-slow"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-pink-600 bg-clip-text text-transparent font-jua tracking-wide">행운의 돌림판</h1>
                    <p class="text-xs text-gray-400">재미있고 간편한 랜덤 추첨 도구</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openPresetsModal()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-list-ul"></i>
                    <span>프리셋</span>
                </button>
                <button onclick="toggleSound()" id="soundToggleBtn" class="w-10 h-10 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-volume-high" id="soundIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Column: Wheel & Controls -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center bg-white/70 backdrop-blur-md p-6 rounded-3xl border border-white/80 shadow-xl relative overflow-hidden">
            <div class="absolute -top-20 -left-20 w-48 h-48 bg-purple-300 rounded-full filter blur-3xl opacity-30 pointer-events-none"></div>
            <div class="absolute -bottom-20 -right-20 w-48 h-48 bg-pink-300 rounded-full filter blur-3xl opacity-30 pointer-events-none"></div>

            <div class="relative w-72 h-72 sm:w-80 sm:h-80 md:w-96 md:h-96 my-4">
                <div class="absolute -top-5 left-1/2 -translate-x-1/2 z-30 w-8 h-10 bg-gradient-to-b from-red-500 to-pink-600 clip-path-arrow shadow-lg flex items-start justify-center pt-1">
                    <div class="w-3 h-3 bg-white rounded-full shadow-inner"></div>
                </div>
                <style>
                    .clip-path-arrow {
                        clip-path: polygon(50% 100%, 0 0, 100% 0);
                    }
                </style>

                <div class="w-full h-full relative wheel-shadow rounded-full overflow-hidden border-4 border-white">
                    <canvas id="wheelCanvas" class="w-full h-full transform transition-transform cursor-pointer"></canvas>
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-white rounded-full shadow-md border-4 border-indigo-100 flex items-center justify-center z-20 cursor-pointer hover:scale-105 transition" onclick="startSpin()">
                        <span class="text-xs font-bold text-indigo-600 font-jua tracking-tighter">START</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-3 mt-4 z-10 w-full max-w-md">
                <button onclick="startSpin()" id="spinBtn" class="flex-1 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-500/30 transform active:scale-95 transition flex items-center justify-center space-x-2 text-lg font-jua">
                    <i class="fa-solid fa-play"></i>
                    <span>돌리기!</span>
                </button>
                <button onclick="skipSpin()" id="skipBtn" class="hidden px-4 py-4 bg-amber-500 hover:bg-amber-400 text-white font-bold rounded-2xl shadow-lg shadow-amber-500/30 transform active:scale-95 transition flex items-center justify-center text-sm font-jua" title="즉시 결과 확인">
                    <i class="fa-solid fa-forward-step mr-1"></i> 스킵
                </button>
                <button onclick="cancelSpin()" id="cancelBtn" class="hidden px-4 py-4 bg-rose-500 hover:bg-rose-400 text-white font-bold rounded-2xl shadow-lg shadow-rose-500/30 transform active:scale-95 transition flex items-center justify-center text-sm font-jua" title="돌리기 취소">
                    <i class="fa-solid fa-stop mr-1"></i> 취소
                </button>
                <button onclick="resetWheel()" class="px-5 py-4 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold rounded-2xl transition flex items-center justify-center" title="초기화">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- Right Column: Item Management & History -->
        <div class="lg:col-span-5 flex flex-col space-y-6">
            
            <!-- Items Section -->
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/80 shadow-xl">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center space-x-2">
                        <i class="fa-solid fa-list-check text-indigo-500"></i>
                        <span>항목 설정 (<span id="itemCount">0</span>개)</span>
                    </h2>
                    <div id="itemNormalActions" class="flex space-x-1 items-center">
                        <button onclick="toggleItemSelectMode(true)" type="button" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl transition text-xs font-semibold flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-square-check"></i>
                            <span>선택하기</span>
                        </button>
                    </div>
                    <div id="itemSelectActions" class="hidden flex space-x-1 items-center">
                        <button onclick="selectAllItems()" type="button" class="px-2.5 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition text-xs font-semibold cursor-pointer">
                            전체 선택
                        </button>
                        <button onclick="swapSelectedItems()" type="button" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition text-xs font-semibold flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-right-left"></i>
                            <span>순서 바꾸기</span>
                        </button>
                        <button onclick="deleteSelectedItems()" type="button" class="px-3 py-1.5 bg-red-500 hover:bg-red-400 text-white rounded-xl transition text-xs font-semibold flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>삭제하기</span>
                        </button>
                        <button onclick="toggleItemSelectMode(false)" type="button" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl transition text-xs font-semibold flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-xmark"></i>
                            <span>취소</span>
                        </button>
                    </div>
                </div>

                <div id="itemSelectGuide" class="hidden mb-3 p-2.5 bg-indigo-50 border border-indigo-100 text-indigo-700 rounded-xl text-xs font-medium flex items-center space-x-2">
                    <i class="fa-solid fa-circle-info"></i>
                    <span id="itemSelectGuideText">선택하면 그 항목들이 순서가 바뀝니다.</span>
                </div>

                <form onsubmit="addItem(event)" class="flex space-x-2 mb-4">
                    <input type="text" id="newItemInput" placeholder="추가할 항목 입력 (예: 치킨)" autocomplete="off"
                        class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm shadow-md shadow-indigo-500/20 transition flex items-center justify-center">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </form>

                <div id="itemsContainer" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1 custom-scrollbar">
                    <!-- Dynamic Items rendered here -->
                </div>
            </div>

            <!-- History Section -->
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/80 shadow-xl flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center space-x-2">
                        <i class="fa-solid fa-history text-pink-500"></i>
                        <span>추첨 기록</span>
                    </h2>
                    <div id="historyNormalActions" class="flex space-x-1 items-center">
                        <button onclick="toggleHistorySelectMode(true)" type="button" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl transition text-xs font-semibold flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-square-check"></i>
                            <span>선택하기</span>
                        </button>
                    </div>
                    <div id="historySelectActions" class="hidden flex space-x-1 items-center">
                        <button onclick="selectAllHistory()" type="button" class="px-2.5 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition text-xs font-semibold cursor-pointer">
                            전체 선택
                        </button>
                        <button onclick="deleteSelectedHistory()" type="button" class="px-3 py-1.5 bg-red-500 hover:bg-red-400 text-white rounded-xl transition text-xs font-semibold flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>삭제</span>
                        </button>
                        <button onclick="toggleHistorySelectMode(false)" type="button" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl transition text-xs font-semibold flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-xmark"></i>
                            <span>취소</span>
                        </button>
                    </div>
                </div>
                <div id="historyContainer" class="flex-1 min-h-[120px] max-h-48 overflow-y-auto space-y-2 pr-1">
                    <div class="text-center text-gray-400 py-8 text-sm">아직 추첨된 기록이 없습니다.</div>
                </div>
            </div>

        </div>

    </main>

    <div id="resultModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContent" class="bg-white rounded-3xl max-w-sm w-full p-6 text-center transform scale-90 transition-transform duration-300 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
            <div class="w-16 h-16 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl animate-bounce">
                <i class="fa-solid fa-award"></i>
            </div>
            <p class="text-sm text-gray-400 font-medium mb-1">축하합니다! 당첨 결과</p>
            <h3 id="modalWinnerName" class="text-3xl font-bold text-gray-800 mb-6 font-jua">치킨</h3>
            <div class="flex space-x-3">
                <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl transition text-sm">닫기</button>
                <button onclick="removeWinnerAndClose()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-2xl transition text-sm shadow-md shadow-indigo-500/20">항목 제거</button>
            </div>
        </div>
    </div>

    <div id="presetsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="presetsModalContent" class="bg-white rounded-3xl max-w-md w-full p-6 transform scale-90 transition-transform duration-300 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800 flex items-center space-x-2">
                    <i class="fa-solid fa-list-ul text-indigo-500"></i>
                    <span>추천 프리셋 선택</span>
                </h3>
                <button onclick="closePresetsModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-3 max-h-72 overflow-y-auto p-1">
                <button onclick="loadPreset('점심 메뉴 추천', ['짜장면', '김치찌개', '돈가스', '초밥', '햄버거', '쌀국수', '제육볶음'])" class="p-4 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-200 border border-gray-100 rounded-2xl text-left transition group">
                    <div class="font-bold text-gray-800 group-hover:text-indigo-600 font-jua text-base mb-1">점심 메뉴</div>
                    <div class="text-xs text-gray-400">짜장면, 김치찌개, 돈가스 등</div>
                </button>
                <button onclick="loadPreset('YES / NO', ['YES', 'NO'])" class="p-4 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-200 border border-gray-100 rounded-2xl text-left transition group">
                    <div class="font-bold text-gray-800 group-hover:text-indigo-600 font-jua text-base mb-1">YES / NO</div>
                    <div class="text-xs text-gray-400">결정이 필요할 때</div>
                </button>
                <button onclick="loadPreset('벌칙 고르기', ['딱밤 맞기', '노래 부르기', '커피 사기', '아무말 대잔치', '셀카 찍기', '댄스 타임'])" class="p-4 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-200 border border-gray-100 rounded-2xl text-left transition group">
                    <div class="font-bold text-gray-800 group-hover:text-indigo-600 font-jua text-base mb-1">벌칙 고르기</div>
                    <div class="text-xs text-gray-400">딱밤, 노래, 커피 사기 등</div>
                </button>
                <button onclick="loadPreset('순서 정하기', ['1번', '2번', '3번', '4번', '5번'])" class="p-4 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-200 border border-gray-100 rounded-2xl text-left transition group">
                    <div class="font-bold text-gray-800 group-hover:text-indigo-600 font-jua text-base mb-1">순서 정하기</div>
                    <div class="text-xs text-gray-400">1번 ~ 5번 발표 순서</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="confirmModalContent" class="bg-white rounded-3xl max-w-xs w-full p-6 text-center transform scale-90 transition-transform duration-300 shadow-2xl relative overflow-hidden">
            <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl animate-pulse">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h3 class="text-base font-bold text-gray-800 mb-2 font-jua">삭제 확인</h3>
            <p id="confirmModalMessage" class="text-sm text-gray-600 mb-6 font-medium">정말로 삭제하시겠습니까?</p>
            <div class="flex space-x-2">
                <button id="confirmCancelBtn" onclick="closeConfirmModal()" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition text-sm">취소</button>
                <button id="confirmOkBtn" class="flex-1 py-2.5 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl transition text-sm shadow-md shadow-red-500/20">확인</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseSDK = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, onSnapshot
        };
        
        window.dispatchEvent(new Event('firebase-sdk-ready'));
    </script>

    <script>
        let items = [];
        let historyList = [];
        let currentAngle = 0;
        let isSpinning = false;
        let soundEnabled = true;
        let lastWinner = '';
        let spinAnimationId = null;
        let pendingWinningIndex = null;
        let pendingFinalAngle = null;

        // Custom Confirm Modal Handler
        let onConfirmAction = null;

        function showConfirmModal(message, callback) {
            document.getElementById('confirmModalMessage').innerText = message;
            onConfirmAction = callback;
            const modal = document.getElementById('confirmModal');
            const content = document.getElementById('confirmModalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-90');
            content.classList.add('scale-100');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const content = document.getElementById('confirmModalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
            onConfirmAction = null;
        }

        document.getElementById('confirmOkBtn').addEventListener('click', () => {
            if (onConfirmAction) {
                onConfirmAction();
            }
            closeConfirmModal();
        });

        // History selection state
        let isHistorySelectMode = false;
        let selectedHistoryIndices = new Set();

        // Item reorder state
        let isItemSelectMode = false;
        let selectedItemIndices = new Set();

        let db = null;
        let auth = null;
        let userId = null;
        let appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let isSyncing = false;

        const colors = [
            '#6366f1', '#ec4899', '#8b5cf6', '#3b82f6', 
            '#f43f5e', '#10b981', '#f59e0b', '#14b8a6', 
            '#9333ea', '#06b6d4', '#e11d48', '#84cc16'
        ];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                console.error(e);
            }
        }

        function playWinSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                    
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.1);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.1);
                    osc.stop(audioCtx.currentTime + index * 0.1 + 0.2);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            drawWheel();
        }

        function drawWheel() {
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            ctx.clearRect(0, 0, width, height);

            if (items.length === 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#f3f4f6';
                ctx.fill();
                ctx.fillStyle = '#9ca3af';
                ctx.font = 'bold 16px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('항목을 추가해주세요', centerX, centerY);
                ctx.restore();
                return;
            }

            const arcSize = (2 * Math.PI) / items.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle);

            for (let i = 0; i < items.length; i++) {
                const angle = i * arcSize;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angle, angle + arcSize);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Inter, Jua, sans-serif';
                
                let text = items[i];
                if (text.length > 10) {
                    text = text.substring(0, 9) + '…';
                }
                ctx.fillText(text, radius - 25, 0);
                ctx.restore();
            }

            ctx.restore();
        }

        function renderItemsList() {
            const container = document.getElementById('itemsContainer');
            document.getElementById('itemCount').innerText = items.length;
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div class="text-xs text-gray-400 py-2">등록된 항목이 없습니다.</div>';
                return;
            }

            items.forEach((item, index) => {
                const isSelected = selectedItemIndices.has(index);
                const tag = document.createElement('div');
                
                if (isItemSelectMode) {
                    tag.className = `inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-medium cursor-pointer transition ${
                        isSelected ? 'bg-indigo-600 text-white shadow-sm' : 'bg-indigo-50 border border-indigo-100 text-indigo-700 hover:bg-indigo-100'
                    }`;
                    tag.onclick = () => toggleItemSelection(index);
                    tag.innerHTML = `
                        <span class="w-4 h-4 rounded-md border flex items-center justify-center text-[10px] ${isSelected ? 'bg-white text-indigo-600 border-white font-bold' : 'border-indigo-300'}">
                            ${isSelected ? '<i class="fa-solid fa-check"></i>' : ''}
                        </span>
                        <span>${escapeHtml(item)}</span>
                    `;
                } else {
                    tag.className = 'inline-flex items-center space-x-1.5 bg-indigo-50 border border-indigo-100 text-indigo-700 px-3 py-1.5 rounded-xl text-xs font-medium group animate-fadeIn';
                    tag.innerHTML = `
                        <span>${escapeHtml(item)}</span>
                        <button onclick="removeItem(${index})" class="text-indigo-400 hover:text-red-500 transition ml-1 cursor-pointer">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                }
                container.appendChild(tag);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function toggleItemSelectMode(enable) {
            isItemSelectMode = enable;
            selectedItemIndices.clear();
            const normalActions = document.getElementById('itemNormalActions');
            const selectActions = document.getElementById('itemSelectActions');
            const guide = document.getElementById('itemSelectGuide');
            const guideText = document.getElementById('itemSelectGuideText');

            if (enable) {
                normalActions.classList.add('hidden');
                selectActions.classList.remove('hidden');
                guide.classList.remove('hidden');
                guideText.innerText = "선택하면 그 항목들이 순서가 바뀝니다.";
            } else {
                normalActions.classList.remove('hidden');
                selectActions.classList.add('hidden');
                guide.classList.add('hidden');
            }
            renderItemsList();
        }

        function toggleItemSelection(idx) {
            if (selectedItemIndices.has(idx)) {
                selectedItemIndices.delete(idx);
            } else {
                selectedItemIndices.add(idx);
            }
            renderItemsList();
        }

        function selectAllItems() {
            if (selectedItemIndices.size === items.length) {
                selectedItemIndices.clear();
            } else {
                for (let i = 0; i < items.length; i++) {
                    selectedItemIndices.add(i);
                }
            }
            renderItemsList();
        }

        function swapSelectedItems() {
            const count = selectedItemIndices.size;
            if (count === 1) {
                alertBox('최소 2개를 선택해주세요.');
                return;
            }
            if (count < 2) {
                alertBox('순서를 바꿀 항목을 2개 이상 선택해주세요.');
                return;
            }

            const indices = Array.from(selectedItemIndices).sort((a, b) => a - b);
            const firstVal = items[indices[0]];

            for (let i = 0; i < indices.length - 1; i++) {
                items[indices[i]] = items[indices[i + 1]];
            }
            items[indices[indices.length - 1]] = firstVal;

            selectedItemIndices.clear();
            toggleItemSelectMode(false);
            renderItemsList();
            drawWheel();
            saveDataToCloud();
            alertBox('선택한 항목들의 순서가 변경되었습니다!');
        }

        function deleteSelectedItems() {
            if (selectedItemIndices.size === 0) {
                alertBox('선택된 항목이 없습니다.');
                return;
            }
            
            showConfirmModal('정말로 삭제하시겠습니까?', () => {
                const newItems = [];
                items.forEach((item, idx) => {
                    if (!selectedItemIndices.has(idx)) {
                        newItems.push(item);
                    }
                });
                items = newItems;
                selectedItemIndices.clear();
                toggleItemSelectMode(false);
                renderItemsList();
                drawWheel();
                saveDataToCloud();
                alertBox('선택한 항목이 삭제되었습니다.');
            });
        }

        function addItem(e) {
            e.preventDefault();
            const input = document.getElementById('newItemInput');
            const val = input.value.trim();
            if (!val) return;
            items.push(val);
            input.value = '';
            renderItemsList();
            drawWheel();
            saveDataToCloud();
        }

        function removeItem(index) {
            showConfirmModal('정말로 삭제하시겠습니까?', () => {
                items.splice(index, 1);
                renderItemsList();
                drawWheel();
                saveDataToCloud();
                alertBox('삭제되었습니다.');
            });
        }

        function clearItems() {
            showConfirmModal('모든 항목을 삭제하시겠습니까?', () => {
                items = [];
                renderItemsList();
                drawWheel();
                saveDataToCloud();
                alertBox('모든 항목이 삭제되었습니다.');
            });
        }

        function toggleHistorySelectMode(enable) {
            isHistorySelectMode = enable;
            selectedHistoryIndices.clear();
            const normalActions = document.getElementById('historyNormalActions');
            const selectActions = document.getElementById('historySelectActions');
            
            if (enable) {
                normalActions.classList.add('hidden');
                selectActions.classList.remove('hidden');
            } else {
                normalActions.classList.remove('hidden');
                selectActions.classList.add('hidden');
            }
            renderHistory();
        }

        function toggleHistorySelection(idx) {
            if (selectedHistoryIndices.has(idx)) {
                selectedHistoryIndices.delete(idx);
            } else {
                selectedHistoryIndices.add(idx);
            }
            renderHistory();
        }

        function selectAllHistory() {
            if (selectedHistoryIndices.size === historyList.length) {
                selectedHistoryIndices.clear();
            } else {
                for (let i = 0; i < historyList.length; i++) {
                    selectedHistoryIndices.add(i);
                }
            }
            renderHistory();
        }

        function deleteSelectedHistory() {
            if (selectedHistoryIndices.size === 0) {
                alertBox('선택된 기록이 없습니다.');
                return;
            }
            showConfirmModal('선택한 추첨 기록을 삭제하시겠습니까?', () => {
                const newHistory = [];
                historyList.forEach((item, idx) => {
                    if (!selectedHistoryIndices.has(idx)) {
                        newHistory.push(item);
                    }
                });
                historyList = newHistory;
                selectedHistoryIndices.clear();
                toggleHistorySelectMode(false);
                renderHistory();
                saveDataToCloud();
                alertBox('선택한 기록이 삭제되었습니다.');
            });
        }

        function removeHistoryItem(idx) {
            showConfirmModal('이 기록을 삭제하시겠습니까?', () => {
                historyList.splice(idx, 1);
                renderHistory();
                saveDataToCloud();
                alertBox('기록이 삭제되었습니다.');
            });
        }

        function shuffleItems() {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            renderItemsList();
            drawWheel();
            saveDataToCloud();
        }

        function openPresetsModal() {
            const modal = document.getElementById('presetsModal');
            const content = document.getElementById('presetsModalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-90');
            content.classList.add('scale-100');
        }

        function closePresetsModal() {
            const modal = document.getElementById('presetsModal');
            const content = document.getElementById('presetsModalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
        }

        function loadPreset(title, presetItems) {
            items = [...presetItems];
            renderItemsList();
            drawWheel();
            closePresetsModal();
            saveDataToCloud();
        }

        function startSpin() {
            if (isSpinning) return;
            if (items.length === 0) {
                alertBox('먼저 항목을 추가해주세요!');
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').classList.add('hidden');
            document.getElementById('skipBtn').classList.remove('hidden');
            document.getElementById('cancelBtn').classList.remove('hidden');

            pendingWinningIndex = Math.floor(Math.random() * items.length);
            const arcSize = (2 * Math.PI) / items.length;

            const extraSpins = 5 + Math.floor(Math.random() * 5);
            const targetSliceCenterAngle = pendingWinningIndex * arcSize + arcSize / 2;
            
            pendingFinalAngle = currentAngle + (extraSpins * 2 * Math.PI) + (2 * Math.PI - ((currentAngle + targetSliceCenterAngle) % (2 * Math.PI))) - (Math.PI / 2);

            const duration = 4000;
            const startTime = performance.now();
            const startAngle = currentAngle;
            let lastTickSlice = -1;

            function animateSpin(currentTime) {
                if (!isSpinning) return;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = startAngle + (pendingFinalAngle - startAngle) * easeOut;
                drawWheel();

                const normalizedAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
                const currentSlice = Math.floor((2 * Math.PI - normalizedAngle) / arcSize) % items.length;
                if (currentSlice !== lastTickSlice) {
                    playTickSound();
                    lastTickSlice = currentSlice;
                }

                if (progress < 1) {
                    spinAnimationId = requestAnimationFrame(animateSpin);
                } else {
                    finishSpin(pendingWinningIndex, pendingFinalAngle);
                }
            }

            spinAnimationId = requestAnimationFrame(animateSpin);
        }

        function skipSpin() {
            if (!isSpinning) return;
            if (spinAnimationId) cancelAnimationFrame(spinAnimationId);
            currentAngle = pendingFinalAngle % (2 * Math.PI);
            drawWheel();
            finishSpin(pendingWinningIndex, pendingFinalAngle);
        }

        function cancelSpin() {
            if (!isSpinning) return;
            if (spinAnimationId) cancelAnimationFrame(spinAnimationId);
            isSpinning = false;
            document.getElementById('spinBtn').classList.remove('hidden');
            document.getElementById('skipBtn').classList.add('hidden');
            document.getElementById('cancelBtn').classList.add('hidden');
            drawWheel();
            alertBox('돌리기가 취소되었습니다.');
        }

        function finishSpin(winningIndex, finalAngle) {
            isSpinning = false;
            document.getElementById('spinBtn').classList.remove('hidden');
            document.getElementById('skipBtn').classList.add('hidden');
            document.getElementById('cancelBtn').classList.add('hidden');
            currentAngle = finalAngle % (2 * Math.PI);
            
            lastWinner = items[winningIndex];
            onWin(lastWinner);
        }

        function onWin(winner) {
            playWinSound();
            
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            addHistory(winner);

            document.getElementById('modalWinnerName').innerText = winner;
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-90');
            content.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
        }

        function removeWinnerAndClose() {
            const index = items.indexOf(lastWinner);
            if (index !== -1 && items.length > 1) {
                items.splice(index, 1);
                renderItemsList();
                drawWheel();
            }
            closeModal();
            saveDataToCloud();
        }

        function addHistory(winner) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeStr = `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;

            historyList.unshift({ winner, time: timeStr });
            renderHistory();
            saveDataToCloud();
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (historyList.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">아직 추첨된 기록이 없습니다.</div>';
                return;
            }

            container.innerHTML = '';
            historyList.forEach((item, idx) => {
                const isSelected = selectedHistoryIndices.has(idx);
                const div = document.createElement('div');
                div.className = `flex justify-between items-center px-4 py-2.5 rounded-xl text-sm border transition animate-fadeIn ${
                    isHistorySelectMode 
                        ? (isSelected ? 'bg-indigo-100 border-indigo-300 cursor-pointer' : 'bg-gray-50 border-gray-100 cursor-pointer hover:bg-gray-100') 
                        : 'bg-gray-50 border-gray-100'
                }`;
                
                if (isHistorySelectMode) {
                    div.onclick = () => toggleHistorySelection(idx);
                }

                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        ${isHistorySelectMode ? `
                            <div class="w-5 h-5 rounded-md border flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-gray-300'}">
                                ${isSelected ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </div>
                        ` : ''}
                        <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 font-bold flex items-center justify-center text-xs">${historyList.length - idx}</span>
                        <span class="font-bold text-gray-800">${escapeHtml(item.winner)}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-gray-400">${item.time}</span>
                        ${!isHistorySelectMode ? `
                            <button onclick="event.stopPropagation(); removeHistoryItem(${idx})" type="button" class="text-gray-400 hover:text-red-500 transition p-1 cursor-pointer" title="기록 삭제">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function resetWheel() {
            currentAngle = 0;
            drawWheel();
        }

        function alertBox(msg) {
            const div = document.createElement('div');
            div.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-xl z-50 text-sm font-medium animate-bounce';
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        async function initFirebase() {
            if (typeof window.FirebaseSDK === 'undefined') {
                window.addEventListener('firebase-sdk-ready', initFirebase);
                return;
            }

            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, getDoc, onSnapshot } = window.FirebaseSDK;

            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                apiKey: "mock-key",
                authDomain: "mock.firebaseapp.com",
                projectId: "mock-project",
                storageBucket: "mock.appspot.com",
                messagingSenderId: "123456",
                appId: "1:123:web:123"
            };

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                userId = auth.currentUser?.uid || crypto.randomUUID();
                
                loadDataFromCloud();
            } catch (err) {
                console.error("Firebase init error:", err);
            }
        }

        async function loadDataFromCloud() {
            if (!db || !userId) return;
            const { doc, getDoc, onSnapshot } = window.FirebaseSDK;
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'spinwheel', 'state');

            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (Array.isArray(data.items)) items = data.items;
                    if (Array.isArray(data.historyList)) historyList = data.historyList;
                    renderItemsList();
                    renderHistory();
                    drawWheel();
                }

                onSnapshot(docRef, (docSnap) => {
                    if (isSyncing) return;
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (Array.isArray(data.items)) items = data.items;
                        if (Array.isArray(data.historyList)) historyList = data.historyList;
                        renderItemsList();
                        renderHistory();
                        drawWheel();
                    }
                }, (error) => {
                    console.error("Firestore snapshot error:", error);
                });
            } catch (e) {
                console.error("Error loading cloud data:", e);
            }
        }

        async function saveDataToCloud() {
            if (!db || !userId) return;
            isSyncing = true;
            const { doc, setDoc } = window.FirebaseSDK;
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'spinwheel', 'state');

            try {
                await setDoc(docRef, {
                    items: items,
                    historyList: historyList,
                    updatedAt: new Date().toISOString()
                });
            } catch (e) {
                console.error("Error saving cloud data:", e);
            } finally {
                setTimeout(() => { isSyncing = false; }, 500);
            }
        }

        window.onload = function() {
            renderItemsList();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            initFirebase();
        };
    </script>
</body>
